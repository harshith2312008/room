<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>room • by harshith</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
</head>
<body>
  <div id="three-container"></div>

  <!-- Auth Screen -->
  <div id="auth-screen" class="screen">
    <div class="apple-card">
      <h1>room</h1>
      <p class="tagline">Connect with people</p>
      
      <div id="auth-form">
        <input type="text" id="auth-username" placeholder="Username" required>
        <input type="password" id="auth-password" placeholder="Password" required>
        <button id="login-btn">Login</button>
        <button id="register-btn">Register</button>
        <p id="auth-message"></p>
      </div>
    </div>
  </div>

  <!-- Chat Screen -->
  <div id="chat-screen" class="screen hidden">
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>room</h2>
        <button onclick="logout()">Logout</button>
      </div>
      
      <div class="tabs">
        <button onclick="switchTab(0)" class="active">Public</button>
        <button onclick="switchTab(1)">Private</button>
      </div>

      <div id="online-users"></div>
    </div>

    <div class="main-chat">
      <div class="chat-header">
        <h3 id="room-title">General Room</h3>
        <div id="typing-indicator"></div>
      </div>

      <div id="messages" class="messages"></div>

      <div class="input-area">
        <input type="text" id="message-input" placeholder="Type a message...">
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <script src="three-scene.js"></script>
  <script src="script.js"></script>
</body>
</html>
